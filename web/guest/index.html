<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sampana — Mode invité</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<style>
  /* Palette unique, bascule automatique clair/sombre. Les deux thèmes
     partagent les mêmes noms : aucune règle en double à maintenir.
     Pas de feuille externe : une requête de moins au premier chargement,
     ce qui compte sur une connexion de téléphone. */
  :root {
    --guest: #7c5cff; --guest-doux: #efeaff;
    --bg: #fbfbfd; --surface: #fff; --line: #e6e6ef;
    --txt: #16161d; --dim: #6b6b7b; --hover: #f3f3f8;
    --warn: #b45309; --err: #dc2626;
    --ombre: 0 1px 2px rgba(20,20,40,.05), 0 8px 24px rgba(20,20,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --guest: #9b84ff; --guest-doux: #241d47;
      --bg: #0e0e13; --surface: #16161d; --line: #26262f;
      --txt: #ececf2; --dim: #9a9aab; --hover: #1e1e27;
      --ombre: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100dvh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--txt);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    /* Encoches et barres gestuelles des téléphones récents. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; background: var(--surface);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10;
  }
  .marque { display: flex; align-items: center; gap: 9px; }
  .marque b { font-size: 16px; letter-spacing: -.2px; }
  .puce {
    font-size: 11px; font-weight: 700; letter-spacing: .3px;
    padding: 3px 9px; border-radius: 99px;
    background: var(--guest-doux); color: var(--guest);
  }
  .spacer { flex: 1 1 auto; }
  #horloge { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  a.quitter {
    color: var(--dim); font-size: 13px; text-decoration: none;
    padding: 8px 10px; border-radius: 8px;
  }
  a.quitter:hover { color: var(--txt); background: var(--hover); }

  .alerte {
    padding: 13px 18px; font-size: 14px; font-weight: 600; text-align: center;
    background: var(--warn); color: #fff;
  }
  .alerte.urgent { background: var(--err); }

  main { flex: 1 1 auto; width: 100%; max-width: 1000px; margin: 0 auto; padding: 22px 18px 40px; }

  .note {
    padding: 15px 17px; margin-bottom: 22px; border-radius: 14px;
    background: var(--guest-doux); font-size: 13.5px; line-height: 1.6;
  }
  .note b { color: var(--guest); }

  h2 {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .8px; color: var(--dim); margin: 0 0 12px;
  }

  .grille { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

  a.outil {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 16px; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 15px; box-shadow: var(--ombre);
    transition: transform .13s ease, border-color .13s ease;
    min-height: 76px;   /* cible confortable au doigt */
  }
  a.outil:active { transform: scale(.985); }
  @media (hover: hover) {
    a.outil:hover { border-color: var(--guest); transform: translateY(-2px); }
  }
  a.outil:focus-visible { outline: 2px solid var(--guest); outline-offset: 2px; }

  .ico {
    width: 44px; height: 44px; flex: 0 0 auto; border-radius: 13px;
    display: grid; place-items: center; font-size: 20px;
    background: var(--guest-doux);
  }
  .txt { min-width: 0; flex: 1 1 auto; }
  .txt b { display: block; font-size: 15px; font-weight: 620; }
  .txt span {
    font-size: 12.5px; color: var(--dim); margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .ident {
    width: 100%; margin-top: 4px; padding-top: 9px;
    border-top: 1px dashed var(--line); font-size: 12px; color: var(--dim);
  }
  .ident code {
    background: var(--hover); padding: 1px 6px; border-radius: 5px;
    font: 12px ui-monospace, Menlo, monospace; color: var(--txt);
  }

  footer { padding: 20px 18px 28px; color: var(--dim); font-size: 12.5px; text-align: center; }

  /* Écran étroit : une colonne, marges réduites. */
  @media (max-width: 560px) {
    main { padding: 16px 14px 32px; }
    .grille { grid-template-columns: 1fr; }
  }
  .actions { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .act {
    display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 16px; min-height: 76px; cursor: pointer; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 15px; box-shadow: var(--ombre);
  }
  .act:hover { border-color: var(--guest); }
  .act.leve { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  #msgTravail { font-size: 13px; margin: 12px 2px 0; min-height: 1.2em; color: var(--dim); }
  #msgTravail.ok { color: var(--guest); }
  #msgTravail.err { color: var(--err); }

  /* Un partage doit se distinguer au premier coup d'oeil des outils
     permanents : bordure pleine, teinte d'accent. */
  a.outil.partage { border-color: var(--guest); background: var(--guest-doux); }

  .outil.indispo {
    opacity: .55; cursor: not-allowed; box-shadow: none;
    border-style: dashed;
  }
  @media (prefers-reduced-motion: reduce) {
    a.outil { transition: none; }
  }
</style>
</head>
<body>

<header>
  <span class="marque">
    <svg width="24" height="24" viewBox="0 0 32 32" fill="none" style="color:var(--guest)" aria-hidden="true">
      <path d="M16 30V17" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M16 17L7 8M16 17V6M16 17l9-9" stroke="currentColor" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="7" cy="7" r="3" fill="currentColor"/>
      <circle cx="16" cy="5" r="3" fill="currentColor"/>
      <circle cx="25" cy="7" r="3" fill="currentColor"/>
    </svg>
    <b>Sampana</b>
  </span>
  <span class="puce">Invité</span>
  <span class="spacer"></span>
  <span id="horloge"></span>
  <a class="quitter" href="/guest/logout">Quitter</a>
</header>

<div class="alerte" id="alerte" hidden></div>

<main>
  <div class="note">
    <b>Rien n'est conservé.</b> Cet espace est partagé et remis à zéro
    régulièrement. Téléchargez votre travail avant de fermer la page.<span id="duree"></span>
  </div>

  <section id="zonePartage" hidden>
    <h2>Partagé par l'enseignant</h2>
    <div class="grille" id="partages"></div>
  </section>

  <h2>Vos outils</h2>
  <div class="grille" id="grille"></div>

  <h2>Votre travail</h2>
  <div class="actions">
    <button class="act" id="rendre" type="button">
      <span class="ico">📤</span>
      <span class="txt"><b>Rendre mon travail</b>
        <span>Envoie un fichier de votre espace à l'enseignant.</span></span>
    </button>
    <button class="act" id="aide" type="button">
      <span class="ico">✋</span>
      <span class="txt"><b>Demander de l'aide</b>
        <span>Signale à l'enseignant que vous êtes bloqué.</span></span>
    </button>
  </div>
  <p class="cfg-msg" id="msgTravail"></p>
</main>

<footer>Session invitée — sans compte et sans sauvegarde.</footer>

<script>
// ── Compte à rebours et préavis ───────────────────────────────────
// Les outils s'ouvrent dans d'autres onglets : un bandeau seul passerait
// inaperçu. On change donc aussi le titre du document, visible depuis la
// barre d'onglets, et on émet une notification si elle est permise.
(() => {
  const alerte  = document.getElementById('alerte');
  const horloge = document.getElementById('horloge');
  const TITRE   = document.title;
  const seuils  = [10, 5];
  const vus     = new Set();

  const fmt = (s) => {
    const m = Math.floor(s / 60);
    return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m} min`;
  };

  const tick = async () => {
    let d;
    try { d = await (await fetch('/guest/remaining', { cache: 'no-store' })).json(); }
    catch { return; }

    // Identifiants du compte partagé : ils changent à chaque séance, donc lus
    // en direct plutôt que figés dans le manifeste.
    if (d.latexEmail) {
      for (const el of document.querySelectorAll('[data-ident]')) {
        el.innerHTML = `Compte partagé — <code>${d.latexEmail}</code> · ` +
                       `mot de passe <code>${d.latexPassword || '—'}</code>`;
      }
    }

    // ── Éléments partagés par l'enseignant ───────────────────────
    // Ils arrivent avec le compte à rebours, donc au plus tard 30 s après le
    // partage. Une notification signale les nouveaux : un bandeau discret
    // passerait inaperçu chez un étudiant absorbé par son notebook.
    majPartages(d.shares || []);

    const s = d.secondsLeft;
    if (!s) {
      document.title = 'Session terminée — Sampana';
      horloge.textContent = '';
      alerte.hidden = false;
      alerte.className = 'alerte urgent';
      alerte.textContent = 'Session terminée. Rechargez la page pour vous reconnecter.';
      return;
    }
    horloge.textContent = `${fmt(s)} restantes`;

    const minutes = Math.ceil(s / 60);
    for (const seuil of seuils) {
      if (minutes <= seuil && !vus.has(seuil)) {
        vus.add(seuil);
        const texte = `Il vous reste ${seuil} minutes. Téléchargez votre travail : rien n'est conservé.`;
        alerte.hidden = false;
        alerte.className = seuil <= 5 ? 'alerte urgent' : 'alerte';
        alerte.textContent = texte;
        document.title = `⚠ ${seuil} min — Sampana`;
        if ('Notification' in window && Notification.permission === 'granted') {
          try { new Notification('Sampana — mode invité', { body: texte }); } catch {}
        }
      }
    }
    if (minutes > seuils[0]) document.title = TITRE;
  };

  const zone     = document.getElementById('zonePartage');
  const bacPart  = document.getElementById('partages');
  const connus   = new Set();
  let   premier  = true;

  const majPartages = (partages) => {
    zone.hidden = !partages.length;
    bacPart.innerHTML = partages.map(p => `
      <a class="outil partage" href="${p.url}" target="_blank" rel="noopener">
        <span class="ico">${p.live ? '🔴' : '📌'}</span>
        <span class="txt"><b>${p.label}</b>
          <span>${p.live ? 'Session en direct — vous pouvez participer'
                         : 'Partagé par l’enseignant'}</span></span>
      </a>`).join('');

    for (const p of partages) {
      if (connus.has(p.id)) continue;
      connus.add(p.id);
      // Au premier chargement, on ne notifie pas : l'étudiant qui arrive en
      // cours de séance serait assailli par tout l'historique.
      if (premier) continue;
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification('Sampana — partage', { body: p.label });
        } catch {}
      }
    }
    premier = false;
  };

  if ('Notification' in window && Notification.permission === 'default') {
    document.addEventListener('click', () => Notification.requestPermission(), { once: true });
  }
  tick();
  setInterval(tick, 30000);
})();

// ── Rendre son travail, demander de l'aide ───────────────────────
(() => {
  const msg = document.getElementById('msgTravail');
  const dire = (t, ok) => { msg.textContent = t; msg.className = 'cfg-msg ' + (ok ? 'ok' : 'err'); };

  document.getElementById('rendre').addEventListener('click', async () => {
    // On lit le fichier depuis l'appareil : le portail n'a pas accès à
    // l'espace de travail du conteneur côté navigateur, et un étudiant sait
    // toujours télécharger son notebook avant de le rendre.
    const champ = document.createElement('input');
    champ.type = 'file';
    champ.accept = '.ipynb,.py,.md,.txt,.tex,.lean,.csv,.excalidraw';
    champ.onchange = async () => {
      const f = champ.files[0];
      if (!f) return;
      if (f.size > 20 * 1024 * 1024) { dire('Fichier trop volumineux (20 Mo max).', false); return; }
      dire('Envoi…', true);
      try {
        const r = await fetch('/guest/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: f.name, content: await f.text() }),
        });
        const out = await r.json();
        dire(r.ok ? `Rendu envoyé : ${out.rendu}` : (out.error || 'Envoi refusé.'), r.ok);
      } catch { dire('Envoi impossible.', false); }
    };
    champ.click();
  });

  const btnAide = document.getElementById('aide');
  let leve = false;
  btnAide.addEventListener('click', async () => {
    leve = !leve;
    btnAide.classList.toggle('leve', leve);
    try {
      await fetch('/guest/help', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ raised: leve }),
      });
      dire(leve ? 'L’enseignant est prévenu. Appuyez à nouveau pour annuler.'
                : 'Demande retirée.', true);
    } catch { dire('Impossible de prévenir l’enseignant.', false); }
  });
})();

// ── Cartes ────────────────────────────────────────────────────────
// Le manifeste vient de bin/render.py : les cartes suivent la configuration
// réelle, sans liste à maintenir en double.
const ICONES = {
  notebook: '📓', sigma: '∑', document: '📄', chat: '💬',
  folder: '📁', box: '🎨', api: '🔌', terminal: '▸', sync: '🔄',
};

fetch('guest.web.json')
  .then(r => r.json())
  .then(cfg => {
    const grille = document.getElementById('grille');
    const mins = Math.round((cfg.ttl || 7200) / 60);
    document.getElementById('duree').textContent =
      ` La session expire au bout de ${Math.floor(mins / 60)} h ${String(mins % 60).padStart(2, '0')}.`;

    // Le port diffère selon le chemin d'accès : Tailscale publie 8443 tandis
    // que Caddy écoute localement sur 8444. Ils DOIVENT différer, sinon
    // tailscaled et Caddy se disputent le port et Caddy refuse de démarrer.
    const viaFunnel = location.protocol === 'https:' && location.hostname.endsWith('.ts.net');
    const retour = `${location.origin}/guest/`;
    const q = (u, l) => `u=${encodeURIComponent(u)}&l=${encodeURIComponent(l)}` +
                        `&b=${encodeURIComponent(retour)}`;

    grille.innerHTML = cfg.services.map(s => {
      // Tailscale ne publie que 443, 8443 et 10000. Un outil sur un autre port
      // est joignable en salle, jamais depuis Internet : on le signale au lieu
      // de fabriquer un lien qui ne mène nulle part.
      if (viaFunnel && s.funnelOk === false) {
        return `<div class="outil indispo">
          <span class="ico">${ICONES[s.icon] || '📦'}</span>
          <span class="txt"><b>${s.label}</b>
            <span>Disponible depuis le réseau de la salle uniquement.</span></span>
        </div>`;
      }
      const port = viaFunnel ? (s.funnelPort || s.port) : s.port;
      // Une page « directe » porte déjà son propre bandeau de retour :
      // l'enveloppe ferait doublon.
      const href = s.direct ? s.path
        : s.route === 'port'
        ? `${location.protocol}//${location.hostname}:${port}/sampana/tool.html?` +
          q(s.openPath || '/', s.label)
        : `/guest/tool.html?` + q(`${s.path}/`, s.label);

      const ident = s.sharedAccount
        ? `<span class="ident" data-ident>Compte partagé — chargement…</span>` : '';

      return `<a class="outil" href="${href}" target="_blank" rel="noopener">
        <span class="ico">${ICONES[s.icon] || '📦'}</span>
        <span class="txt"><b>${s.label}</b><span>${s.desc}</span></span>
        ${ident}
      </a>`;
    }).join('');
  })
  .catch(() => {
    document.getElementById('grille').innerHTML =
      '<p style="color:var(--dim)">Impossible de charger la liste des outils.</p>';
  });
</script>

</body>
</html>
