<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sampana</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<style>
  :root {
    --guest: #a78bfa; --bg: #0d1117; --surface: #161b22;
    --line: #2a3441; --txt: #e6edf3; --dim: #8b98a9;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f8fa; --surface: #fff; --line: #d8dee4; --txt: #1f2328; --dim: #5b6673; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: var(--bg); color: var(--txt);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 8px 14px;
    background: var(--surface); border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  a.back {
    display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
    color: var(--txt); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 13px; font-weight: 600; font-size: 13px;
  }
  a.back:hover { border-color: var(--guest); }
  .label { font-weight: 600; font-size: 14px; }
  .spacer { flex: 1 1 auto; }
  .badge {
    font-size: 11px; font-weight: 650; padding: 3px 9px; border-radius: 99px;
    background: color-mix(in srgb, var(--guest) 18%, transparent); color: var(--guest);
  }
  #clock { color: var(--dim); font-size: 12.5px; }
  /* `min-height: 0` : un element flex refuse par defaut de descendre sous la
     taille de son contenu et deborde du conteneur, ce qui coupe le bas de
     l'outil. Meme defaut, meme correctif que dans l'enveloppe enseignant. */
  iframe { flex: 1 1 auto; min-height: 0; width: 100%; border: 0; background: #fff; }
  .alert {
    padding: 9px 14px; font-size: 13.5px; font-weight: 600; text-align: center;
    background: #b45309; color: #fff; flex: 0 0 auto;
  }
  .alert.urgent { background: #b91c1c; }
</style>
</head>
<body>

<header>
  <a class="back" id="back" href="#">← Outils</a>
  <span class="label" id="label"></span>
  <span class="spacer"></span>
  <span id="clock"></span>
  <span class="badge">Invité</span>
</header>

<div class="alert" id="alert" hidden></div>
<iframe id="frame" title="Outil"></iframe>

<script>
// Enveloppe donnant un bouton retour aux outils invites.
//
// Aucun d'eux n'en propose : un etudiant entre dans JupyterLab ou LaTeX Lab et
// n'a plus aucun moyen de revenir a la liste. On les affiche donc dans un cadre
// surmonte d'une barre.
//
// Cette page est servie SUR LE MEME PORT que l'outil qu'elle encadre. C'est
// necessaire : LaTeX Lab renvoie `X-Frame-Options: SAMEORIGIN`, et un port
// different compte comme une origine differente. Encadre depuis le port du
// tableau de bord, il n'afficherait qu'un cadre blanc.
// Les parametres viennent de l'URL, donc de n'importe qui : un lien pouvait
// etre forge et envoye a un etudiant. Ils sont donc VALIDES avant usage.
//
//   `b` finissait dans un href : `?b=javascript:...` executait du script dans
//   l'origine du portail des le clic sur « Retour ».
//   `u` finissait dans un iframe : `?u=https://site-attaquant` affichait une
//   page tierce entouree du bandeau Sampana — un cadre de hameconnage credible.
//
// Seuls des chemins de CETTE origine sont acceptes. `//hote` est rejete : c'est
// une URL protocole-relative, qui pointe ailleurs malgre son allure de chemin.
// Un chemin de cette origine. `//hote` est rejete : c'est une URL
// protocole-relative, qui pointe ailleurs malgre son allure de chemin.
const chemin = (v, repli) =>
  (typeof v === 'string' && v.startsWith('/') && !v.startsWith('//')) ? v : repli;

// Le lien retour vise parfois un AUTRE PORT : l'enveloppe de LaTeX Lab est
// servie sur 8444, le tableau de bord vit sur 8081. On accepte donc une URL
// absolue, a condition qu'elle designe le meme hote — elle ne peut alors
// ramener que sur cette machine.
const retourValide = (v, repli) => {
  const p = chemin(v, null);
  if (p) return p;
  try {
    const u = new URL(v, location.href);
    if ((u.protocol === 'http:' || u.protocol === 'https:')
        && u.hostname === location.hostname) return u.href;
  } catch {}
  return repli;
};

const params = new URLSearchParams(location.search);
const url    = chemin(params.get('u'), '/');
const label  = params.get('l') || 'Outil';
const back   = retourValide(params.get('b'), '/guest/');

document.getElementById('label').textContent = label;   // textContent : jamais interprete
document.getElementById('back').href = back;
document.title = `${label} — Sampana`;
document.getElementById('frame').src = url;

// Preavis de fin de seance, repris du tableau de bord : un etudiant qui passe
// deux heures dans un notebook ne verrait jamais l'avertissement autrement.
(() => {
  const alertBox = document.getElementById('alert');
  const clock    = document.getElementById('clock');
  const seuils   = [10, 5];
  const vus      = new Set();

  const fmt = (s) => {
    const m = Math.floor(s / 60);
    return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m} min`;
  };

  const tick = async () => {
    let data;
    try {
      // Chemin absolu depuis l'origine courante : sur le port d'un outil, le
      // portail est monte a la meme adresse.
      data = await (await fetch('/guest/remaining', { cache: 'no-store' })).json();
    } catch { return; }

    const s = data.secondsLeft;
    if (!s) {
      clock.textContent = '';
      alertBox.hidden = false;
      alertBox.className = 'alert urgent';
      alertBox.textContent = 'Session terminée.';
      return;
    }
    clock.textContent = `${fmt(s)} restantes`;

    const minutes = Math.ceil(s / 60);
    for (const seuil of seuils) {
      if (minutes <= seuil && !vus.has(seuil)) {
        vus.add(seuil);
        alertBox.hidden = false;
        alertBox.className = seuil <= 5 ? 'alert urgent' : 'alert';
        alertBox.textContent =
          `Il vous reste ${seuil} minutes. Téléchargez votre travail : rien n'est conservé.`;
        document.title = `⚠ ${seuil} min — ${label}`;
      }
    }
  };
  tick();
  setInterval(tick, 30000);
})();
</script>

</body>
</html>
